# Desenvolvimento com contêineres (opcional): docker compose up --build
# Precisa de MOTHERDUCK_TOKEN no ambiente (DATABASE padrão: md:bdr). Sem acesso ao MotherDuck, o fallback lê
# o banco da carga montado em /dados (padrão: ../load_BDR/dados_bdr; mude com DADOS_CARGA).
services:
  api:
    build: ./api
    environment:
      DATABASE: ${DATABASE:-md:bdr}
      MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN:-}
      DATABASE_LOCAL: /dados/bdr_final.duckdb
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ${DADOS_CARGA:-../load_BDR/dados_bdr}:/dados:ro
    ports:
      - "8000:8000"
  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
